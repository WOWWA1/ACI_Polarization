# @package _global_

# Polarization Compass Navigation Task
# =====================================
# A task that can ONLY be solved using polarization vision.

defaults:
  - /env/mazes@env.mazes.maze: COMPASS_OPEN

  - maze_task

  # Point agent with polarization eye
  - /env/agents@env.agents.agent: point
  - /env/agents/eyes@env.agents.agent.eyes.eye: polarization

  # Goal object
  - /env/agents@env.agents.goal: object_sphere

env:
  instance:
    _target_: cambrian.envs.polarization_compass_env.MjCambrianPolarizationCompassEnv
    _partial_: true

  max_episode_steps: 500

  xml:
    xml_string: ${read:${path:${package:},models,polarization_compass_scene.xml}}

  renderer:
    render_modes: []

  agents:
    agent:
      eyes:
        eye:
          sun_light_name: sun_light
          resolution: [16, 16]
          fov: [140, 140]
          coord: [70, 0]
          max_polarization: 0.75
          sky_depth_threshold: 0.95

    goal:
      custom:
        size: 0.3
        rgba: "1.0 0.0 0.0 1.0"

  mazes:
    maze:
      agent_id_map:
        E: ${glob:agent*,${oc.dict.keys:env.agents}}
        O: ${glob:goal*,${oc.dict.keys:env.agents}}

  reward_fn:
    reward_if_done:
      _target_: cambrian.envs.reward_fns.reward_fn_done
      _partial_: true
      termination_reward: 10.0
      truncation_reward: -5.0
      disable_on_max_episode_steps: true
      for_agents: ${glob:agent*,${oc.dict.keys:env.agents}}
      scale_by_quickness: true

    euclidean_delta_to_goal:
      _target_: cambrian.envs.reward_fns.reward_fn_euclidean_delta_to_agent
      _partial_: true
      reward: 1.0
      for_agents: ${glob:agent*,${oc.dict.keys:env.agents}}
      to_agents: ${glob:goal*,${oc.dict.keys:env.agents}}

  truncation_fn:
    truncate_if_low_reward:
      _target_: cambrian.envs.done_fns.done_if_low_reward
      _partial_: true
      threshold: -20.0

  termination_fn:
    terminate_if_close_to_goal:
      _target_: cambrian.envs.done_fns.done_if_close_to_agents
      _partial_: true
      for_agents: ${glob:agent*,${oc.dict.keys:env.agents}}
      to_agents: ${glob:goal*,${oc.dict.keys:env.agents}}
      distance_threshold: 1.5

eval_env:
  reward_fn:
    reward_if_done:
      termination_reward: 10.0
    euclidean_delta_to_goal:
      reward: 1.0

  truncation_fn:
    truncate_if_low_reward:
      disable: true
